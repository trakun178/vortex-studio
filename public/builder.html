<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Конструктор виджета — VORTEX</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, Roboto, sans-serif;
      }
      body {
        background: #080b0f;
        color: #e8eef4;
        padding: 16px;
        font-size: 13px;
      }
      h1 {
        font-size: 17px;
        color: #39ff6e;
        margin-bottom: 12px;
      }
      label {
        display: block;
        margin-bottom: 10px;
        color: #7a9ab0;
      }
      select,
      input,
      textarea {
        width: 100%;
        background: #0e1318;
        border: 1px solid #1e2d3d;
        border-radius: 8px;
        color: #e8eef4;
        padding: 8px;
        font-size: 13px;
        margin-top: 4px;
      }
      .row {
        border: 1px solid #1e2d3d;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
        background: #0e1318;
      }
      .row .del {
        float: right;
        background: none;
        border: none;
        color: #ff5f56;
        cursor: pointer;
        font-size: 12px;
      }
      button {
        background: #39ff6e;
        color: #080b0f;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
        margin: 4px 4px 4px 0;
      }
      button.ghost {
        background: transparent;
        border: 1px solid #1e2d3d;
        color: #7a9ab0;
      }
      #status {
        margin-top: 10px;
        color: #7a9ab0;
        word-break: break-word;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>🛠 Конструктор виджета «Витрина»</h1>
    <label
      >Расположение:
      <select id="type">
        <option value="list">Вертикально (список)</option>
        <option value="tiles">Горизонтально (плитки с фото)</option>
      </select>
    </label>
    <label
      ><input type="checkbox" id="hello" checked style="width: auto" />
      Приветствие по имени посетителя</label
    >
    <div id="rows"></div>
    <button class="ghost" id="addRow">+ Добавить строку</button>
    <button class="ghost" id="photos">📷 Загрузить фото (для плиток)</button>
    <input
      type="file"
      id="file"
      accept="image/*"
      multiple
      style="display: none"
    />
    <hr style="border-color: #1e2d3d; margin: 12px 0" />
    <button id="install">📦 Установить виджет</button>
    <button id="update">🔄 Обновить установленный</button>
    <div id="status"></div>

    <script src="/vk-bridge.js"></script>
    <script>
      var GROUP_ID = 232319212;
      var APP_URL = "https://vk.com/app547116803_-232319212";
      var bridge = window.vkBridge || window.VKBridge;
      var rows = [
        {
          t: "Лендинг · 15 000 ₽",
          d: "Продающий сайт, запуск от 7 дней",
          b: "Выбрать",
          u: APP_URL + "#go=landing",
          icon: "",
        },
        {
          t: "Корпоративный · 60 000 ₽",
          d: "До 20 страниц, CMS, мультиязычность",
          b: "Выбрать",
          u: APP_URL + "#go=corporate",
          icon: "",
        },
        {
          t: "Портал · от 150 000 ₽",
          d: "Личный кабинет, API, роли, DevOps",
          b: "Выбрать",
          u: APP_URL + "#go=portal",
          icon: "",
        },
        {
          t: "Telegram-бот · 35 000 ₽",
          d: "Заказы, автоответы, оплата в чате",
          b: "Выбрать",
          u: APP_URL + "#go=bot",
          icon: "",
        },
      ];
      var TOKEN = "";

      function st(t) {
        document.getElementById("status").textContent = t;
      }
      function esc(s) {
        return String(s || "").replace(/"/g, "'");
      }

      function render() {
        var box = document.getElementById("rows");
        box.innerHTML = "";
        rows.forEach(function (r, i) {
          var d = document.createElement("div");
          d.className = "row";
          d.innerHTML =
            '<button class="del" data-i="' +
            i +
            '">✕ удалить</button>' +
            '<label>Заголовок и цена<input data-i="' +
            i +
            '" data-f="t" value="' +
            esc(r.t) +
            '"></label>' +
            '<label>Описание<input data-i="' +
            i +
            '" data-f="d" value="' +
            esc(r.d) +
            '"></label>' +
            '<label>Текст кнопки<input data-i="' +
            i +
            '" data-f="b" value="' +
            esc(r.b) +
            '"></label>' +
            '<label>Ссылка<input data-i="' +
            i +
            '" data-f="u" value="' +
            esc(r.u) +
            '"></label>' +
            (r.icon
              ? '<small style="color:#39ff6e">📷 фото загружено</small>'
              : "");
          box.appendChild(d);
        });
      }
      render();

      document.getElementById("rows").addEventListener("input", function (e) {
        var i = e.target.dataset.i,
          f = e.target.dataset.f;
        if (i !== undefined) rows[i][f] = e.target.value;
      });
      document.getElementById("rows").addEventListener("click", function (e) {
        if (e.target.classList.contains("del")) {
          rows.splice(e.target.dataset.i, 1);
          render();
        }
      });
      document.getElementById("addRow").onclick = function () {
        rows.push({
          t: "Услуга · цена",
          d: "Описание",
          b: "Выбрать",
          u: APP_URL,
          icon: "",
        });
        render();
      };

      function buildCode() {
        var type = document.getElementById("type").value;
        var hello = document.getElementById("hello").checked;
        var head = hello
          ? 'var u = API.users.get()[0]; var head = "Добрый день, " + u.first_name + "! VORTEX.studio";'
          : 'var head = "VORTEX.studio — услуги и цены";';
        var items = rows
          .map(function (r) {
            if (type === "tiles")
              return (
                '{"title":"' +
                esc(r.t) +
                '","descr":"' +
                esc(r.d) +
                '","link":"' +
                esc(r.b) +
                '","link_url":"' +
                esc(r.u) +
                '","url":"' +
                esc(r.u) +
                '","icon_id":"' +
                esc(r.icon) +
                '"}'
              );
            return (
              '{"title":"' +
              esc(r.t) +
              '","descr":"' +
              esc(r.d) +
              '","button":"' +
              esc(r.b) +
              '","button_url":"' +
              esc(r.u) +
              '","url":"' +
              esc(r.u) +
              '"}'
            );
          })
          .join(",");
        var key = type === "tiles" ? "tiles" : "rows";
        return (
          head +
          'return {"title": head, "' +
          key +
          '": [' +
          items +
          '], "more": "Все услуги и цены", "more_url": "' +
          APP_URL +
          '"};'
        );
      }

      async function getToken() {
        if (TOKEN) return TOKEN;
        var r = await bridge.send("VKWebAppGetCommunityToken", {
          group_id: GROUP_ID,
          scope: "app_widget",
        });
        TOKEN = r.access_token;
        return TOKEN;
      }

      document.getElementById("install").onclick = async function () {
        try {
          var type = document.getElementById("type").value;
          var r = await bridge.send("VKWebAppShowCommunityWidgetPreviewBox", {
            group_id: GROUP_ID,
            type: type,
            code: buildCode(),
          });
          st(
            "✅ Превью показано (result=" +
              r.result +
              "). Подтвердите установку.",
          );
        } catch (e) {
          st("⚠️ " + JSON.stringify(e));
        }
      };

      document.getElementById("update").onclick = async function () {
        try {
          var t = await getToken();
          var type = document.getElementById("type").value;
          var r = await fetch(
            "https://api.vk.com/method/appWidgets.update?v=5.199&access_token=" +
              t +
              "&type=" +
              type +
              "&code=" +
              encodeURIComponent(buildCode()),
          ).json();
          st(
            r.response
              ? "✅ Виджет обновлён для всех!"
              : "⚠️ " + JSON.stringify(r.error),
          );
        } catch (e) {
          st("⚠️ update: " + JSON.stringify(e));
        }
      };

      document.getElementById("photos").onclick = function () {
        document.getElementById("file").click();
      };
      document.getElementById("file").onchange = async function () {
        try {
          var t = await getToken();
          var su = await fetch(
            "https://api.vk.com/method/appWidgets.getAppImageUploadServer?v=5.199&access_token=" +
              t,
          ).json();
          if (su.error) {
            st("⚠️ uploadServer: " + JSON.stringify(su.error));
            return;
          }
          var files = Array.from(this.files);
          for (var i = 0; i < files.length && i < rows.length; i++) {
            var fd = new FormData();
            fd.append("file", files[i]);
            var up = await (
              await fetch(su.response.upload_url, { method: "POST", body: fd })
            ).json();
            var sv = await fetch(
              "https://api.vk.com/method/appWidgets.saveAppImage?v=5.199&access_token=" +
                t +
                "&server=" +
                up.server +
                "&hash=" +
                up.hash +
                "&photo=" +
                up.photo,
            ).json();
            if (sv.response && sv.response.id) rows[i].icon = sv.response.id;
          }
          render();
          st("✅ Фото привязаны к строкам. Нажмите «Установить/Обновить».");
        } catch (e) {
          st("⚠️ " + JSON.stringify(e));
        }
      };
    </script>
  </body>
</html>

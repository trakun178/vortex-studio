<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VORTEX — конструктор витрин</title>
    <style>
      :root {
        --g: #39ff6e;
        --bg: #080b0f;
        --card: #0e1318;
        --line: #1e2d3d;
        --txt: #e8eef4;
        --mut: #7a9ab0;
        --dim: #4a6070;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      body {
        background: var(--bg);
        color: var(--txt);
        padding: 20px 16px 40px;
        max-width: 860px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        font-weight: 900;
        margin-bottom: 4px;
      }
      h1 span {
        color: var(--g);
      }
      .sub {
        color: var(--mut);
        font-size: 12px;
        margin-bottom: 16px;
      }
      .box {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        background: var(--card);
      }
      .box h4 {
        color: var(--g);
        font-size: 13px;
        margin-bottom: 8px;
      }
      .box small {
        color: var(--dim);
        font-size: 10px;
      }
      .tpls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin: 8px 0;
      }
      .tpl {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px;
        cursor: pointer;
        background: #0e1318;
      }
      .tpl.on {
        border-color: var(--g);
        background: #0e1a10;
      }
      .tpl .nm {
        font-size: 10px;
        font-weight: 800;
        margin-top: 4px;
      }
      .tpl .hn {
        font-size: 9px;
        color: var(--dim);
        line-height: 1.3;
      }
      .act {
        margin-top: 10px;
      }
      .act button {
        background: var(--g);
        border: none;
        color: #08100a;
        font-weight: 800;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 12px;
        cursor: pointer;
        margin: 3px 3px 3px 0;
      }
      .act button.ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--mut);
      }
      .msg {
        margin-top: 8px;
        font-size: 11px;
        color: var(--mut);
        word-break: break-word;
      }
      label {
        font-size: 11px;
        color: var(--mut);
      }
    </style>
  </head>
  <body>
    <h1>🛠 Конструктор витрин <span>VORTEX.studio</span></h1>
    <p class="sub">
      Работает вне VK — без CSP-ограничений. Изменения применяются к витрине
      группы через сервер (ключ сообщества хранится в Apps Script).
    </p>
    <div class="box">
      <h4>Выбери образец витрины</h4>
      <div class="tpls" id="tpls"></div>
      <label
        ><input type="checkbox" id="bHello" checked /> приветствие по имени
        посетителя</label
      >
      <div id="bRows" style="margin-top: 10px"></div>
      <div class="act">
        <button class="ghost" id="bAdd">+ Строка</button>
        <button class="ghost" id="bPhotos">📷 Фото (по строкам)</button>
        <input
          type="file"
          id="bFile"
          accept="image/*"
          multiple
          style="display: none"
        />
      </div>
      <div class="act">
        <button id="bUpdate">🔄 Обновить витрину в группе</button>
      </div>
      <div class="msg" id="bStatus"></div>
    </div>
    <script>
      (function () {
        var APP_URL = "https://vk.com/app54716803_-232319212";
        var API_HOOK =
          "https://script.google.com/macros/s/AKfycbxEJymh4AhHWhrp9AhvZuXqt-AikkntLYdmxqleBQ9XwwU-00A7hTqOMTLFFapEGqcc/exec";
        var VK_SECRET = "vortex2026";

        var R =
          '<div style="display:flex;gap:3px;align-items:center;margin:3px 0"><span style="width:8px;height:8px;border-radius:2px;background:#39ff6e"></span><span style="flex:1;height:3px;background:#2e4050"></span><span style="width:10px;height:6px;border-radius:2px;background:#1e2d3d"></span></div>';
        var RN =
          '<div style="display:flex;gap:3px;align-items:center;margin:3px 0"><span style="width:8px;height:8px"></span><span style="flex:1;height:3px;background:#2e4050"></span><span style="width:10px;height:6px;border-radius:2px;background:#1e2d3d"></span></div>';
        var TPLS = [
          {
            id: "list_photo",
            type: "list",
            name: "Список с фото",
            hint: "вертикально: фото, описание, кнопка",
            icons: true,
            prev: R + R + R,
          },
          {
            id: "list",
            type: "list",
            name: "Список",
            hint: "вертикально, без фото",
            icons: false,
            prev: RN + RN + RN,
          },
          {
            id: "tiles",
            type: "tiles",
            name: "Плитки",
            hint: "горизонтальная сетка с фото",
            icons: true,
            prev: '<div style="display:flex;gap:3px;margin:3px 0"><span style="flex:1;height:14px;border-radius:2px;background:#16321f;border:1px solid #39ff6e50"></span><span style="flex:1;height:14px;border-radius:2px;background:#16321f;border:1px solid #39ff6e50"></span></div><div style="display:flex;gap:3px;margin:3px 0"><span style="flex:1;height:14px;border-radius:2px;background:#16321f;border:1px solid #39ff6e50"></span><span style="flex:1;height:14px;border-radius:2px;background:#16321f;border:1px solid #39ff6e50"></span></div>',
          },
          {
            id: "cover_list",
            type: "cover_list",
            name: "Обложка+список",
            hint: "большое фото сверху, строки ниже",
            icons: false,
            cover: true,
            prev:
              '<div style="height:12px;border-radius:2px;background:#16321f;border:1px solid #39ff6e50;margin:3px 0"></div>' +
              RN +
              RN,
          },
          {
            id: "compact",
            type: "compact_list",
            name: "Компактный",
            hint: "тонкие строки",
            icons: false,
            prev: '<div style="height:5px;background:#2e4050;border-radius:2px;margin:4px 0"></div><div style="height:5px;background:#2e4050;border-radius:2px;margin:4px 0"></div><div style="height:5px;background:#2e4050;border-radius:2px;margin:4px 0"></div>',
          },
          {
            id: "text",
            type: "text",
            name: "Текст",
            hint: "текстовый блок услуг",
            icons: false,
            prev: '<div style="height:3px;background:#39ff6e;margin:3px 0"></div><div style="height:3px;background:#2e4050;margin:3px 0"></div><div style="height:3px;background:#2e4050;margin:3px 0"></div><div style="height:3px;background:#2e4050;margin:3px 0"></div>',
          },
        ];
        function tpl() {
          for (var i = 0; i < TPLS.length; i++)
            if (TPLS[i].id === CFG.tpl) return TPLS[i];
          return TPLS[0];
        }

        var DEF = {
          tpl: "list_photo",
          hello: true,
          cover: "",
          rows: [
            {
              t: "Лендинг · 15 000 ₽",
              d: "Продающий сайт, запуск от 7 дней",
              b: "Выбрать",
              u: APP_URL + "#go=landing",
              icon: "",
            },
            {
              t: "Корпоративный · 60 000 ₽",
              d: "До 20 страниц, CMS, мультиязычность",
              b: "Выбрать",
              u: APP_URL + "#go=corporate",
              icon: "",
            },
            {
              t: "Портал · от 150 000 ₽",
              d: "Личный кабинет, API, роли, DevOps",
              b: "Выбрать",
              u: APP_URL + "#go=portal",
              icon: "",
            },
            {
              t: "Telegram-бот · 35 000 ₽",
              d: "Заказы, автоответы, оплата в чате",
              b: "Выбрать",
              u: APP_URL + "#go=bot",
              icon: "",
            },
          ],
        };
        var CFG;
        try {
          CFG =
            JSON.parse(localStorage.getItem("vortex_widget_cfg") || "null") ||
            JSON.parse(JSON.stringify(DEF));
        } catch (e) {
          CFG = JSON.parse(JSON.stringify(DEF));
        }
        function saveCfg() {
          try {
            localStorage.setItem("vortex_widget_cfg", JSON.stringify(CFG));
          } catch (e) {}
        }
        function esc(s) {
          return String(s == null ? "" : s).replace(/"/g, "'");
        }
        function bSt(t) {
          document.getElementById("bStatus").textContent = t;
        }
        function postVk(payload) {
          payload.key = VK_SECRET;
          return fetch(API_HOOK, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
          }).then(function (r) {
            return r.json();
          });
        }

        function buildCode() {
          var t = tpl();
          var head = CFG.hello
            ? 'var u = API.users.get()[0]; var head = "Добрый день, " + u.first_name + "! VORTEX.studio";'
            : 'var head = "VORTEX.studio — услуги и цены";';
          var items = CFG.rows
            .map(function (r) {
              if (t.id === "tiles")
                return (
                  '{"title":"' +
                  esc(r.t) +
                  '","descr":"' +
                  esc(r.d) +
                  '","link":"' +
                  esc(r.b) +
                  '","link_url":"' +
                  esc(r.u) +
                  '","url":"' +
                  esc(r.u) +
                  '","icon_id":"' +
                  esc(r.icon) +
                  '"}'
                );
              if (t.id === "list_photo")
                return (
                  '{"title":"' +
                  esc(r.t) +
                  '","descr":"' +
                  esc(r.d) +
                  '","button":"' +
                  esc(r.b) +
                  '","button_url":"' +
                  esc(r.u) +
                  '","url":"' +
                  esc(r.u) +
                  '"' +
                  (r.icon ? ',"icon_id":"' + esc(r.icon) + '"' : "") +
                  "}"
                );
              if (t.id === "compact")
                return (
                  '{"title":"' +
                  esc(r.t) +
                  '","button":"' +
                  esc(r.b) +
                  '","button_url":"' +
                  esc(r.u) +
                  '","url":"' +
                  esc(r.u) +
                  '"}'
                );
              return (
                '{"title":"' +
                esc(r.t) +
                '","descr":"' +
                esc(r.d) +
                '","button":"' +
                esc(r.b) +
                '","button_url":"' +
                esc(r.u) +
                '","url":"' +
                esc(r.u) +
                '"}'
              );
            })
            .join(",");
          if (t.id === "text") {
            var txt = CFG.rows
              .map(function (r) {
                return esc(r.t) + " — " + esc(r.d);
              })
              .join("\\n");
            if (txt.length > 200) txt = txt.slice(0, 197) + "…";
            return (
              head +
              'return {"title": head, "text": "' +
              txt +
              '", "link": "Все услуги и цены", "link_url": "' +
              APP_URL +
              '"};'
            );
          }
          if (t.id === "cover_list") {
            return (
              head +
              'return {"title": head, "cover_id": "' +
              esc(CFG.cover) +
              '", "rows": [' +
              items +
              '], "more": "Все услуги и цены", "more_url": "' +
              APP_URL +
              '"};'
            );
          }
          var key = t.id === "tiles" ? "tiles" : "rows";
          return (
            head +
            'return {"title": head, "' +
            key +
            '": [' +
            items +
            '], "more": "Все услуги и цены", "more_url": "' +
            APP_URL +
            '"};'
          );
        }

        function renderTpls() {
          var box = document.getElementById("tpls");
          box.innerHTML = "";
          TPLS.forEach(function (t) {
            var d = document.createElement("div");
            d.className = "tpl" + (t.id === CFG.tpl ? " on" : "");
            d.innerHTML =
              '<div style="background:#0a0e14;border-radius:4px;padding:4px">' +
              t.prev +
              '</div><div class="nm">' +
              t.name +
              '</div><div class="hn">' +
              t.hint +
              "</div>";
            d.onclick = function () {
              CFG.tpl = t.id;
              saveCfg();
              renderTpls();
            };
            box.appendChild(d);
          });
        }
        function renderRows() {
          var box = document.getElementById("bRows");
          box.innerHTML = "";
          CFG.rows.forEach(function (r, i) {
            var d = document.createElement("div");
            d.style.cssText =
              "border:1px solid #1e2d3d;border-radius:10px;padding:8px;margin-bottom:8px;background:#0e1318";
            d.innerHTML =
              '<button data-del="' +
              i +
              '" style="float:right;background:none;border:none;color:#ff5f56;cursor:pointer;font-size:11px">✕</button>' +
              '<small>Заголовок и цена</small><input data-i="' +
              i +
              '" data-f="t" value="' +
              esc(r.t) +
              '" style="width:100%;margin:2px 0 6px;background:#141c24;border:1px solid #1e2d3d;border-radius:6px;color:#e8eef4;padding:6px;font-size:12px">' +
              '<small>Описание</small><input data-i="' +
              i +
              '" data-f="d" value="' +
              esc(r.d) +
              '" style="width:100%;margin:2px 0 6px;background:#141c24;border:1px solid #1e2d3d;border-radius:6px;color:#e8eef4;padding:6px;font-size:12px">' +
              '<small>Кнопка</small><input data-i="' +
              i +
              '" data-f="b" value="' +
              esc(r.b) +
              '" style="width:44%;background:#141c24;border:1px solid #1e2d3d;border-radius:6px;color:#e8eef4;padding:6px;font-size:12px">' +
              ' <small>Ссылка</small><input data-i="' +
              i +
              '" data-f="u" value="' +
              esc(r.u) +
              '" style="width:50%;background:#141c24;border:1px solid #1e2d3d;border-radius:6px;color:#e8eef4;padding:6px;font-size:12px">' +
              (r.icon
                ? '<div style="color:#39ff6e;font-size:10px;margin-top:4px">📷 фото привязано</div>'
                : "");
            box.appendChild(d);
          });
        }

        function update() {
          var t = tpl();
          if (t.icons) {
            var miss = CFG.rows.some(function (r) {
              return !r.icon;
            });
            if (miss) {
              bSt(
                "⚠️ Для «" + t.name + "» нужны фото у всех строк: сначала 📷.",
              );
              return;
            }
          }
          if (t.cover && !CFG.cover) {
            bSt(
              "⚠️ Для «Обложка+список» нужна обложка: нажми 📷 (первое фото станет обложкой).",
            );
            return;
          }
          bSt("Обновляем через сервер…");
          postVk({ kind: "vkUpdate", type: t.type, code: buildCode() })
            .then(function (j) {
              bSt(
                j.ok
                  ? "✅ Витрина обновлена для всех!"
                  : "⚠️ " + JSON.stringify(j.error),
              );
            })
            .catch(function (e) {
              bSt("⚠️ " + e);
            });
        }

        function uploadPhotos() {
          var files = Array.from(this.files);
          bSt("Загружаем фото через сервер…");
          postVk({
            kind: "vkUploadUrl",
            image_type: tpl().id === "cover_list" ? "510x128" : "160x160",
          })
            .then(function (j) {
              if (!j.ok) throw j.error;
              var chain = Promise.resolve();
              files.forEach(function (f, idx) {
                chain = chain.then(function () {
                  var fd = new FormData();
                  fd.append("file", f);
                  return fetch(j.upload_url, { method: "POST", body: fd })
                    .then(function (r) {
                      return r.json();
                    })
                    .then(function (up) {
                      return postVk({
                        kind: "vkSaveImage",
                        server: up.server,
                        hash: up.hash,
                        photo: up.photo,
                      });
                    })
                    .then(function (sv) {
                      if (sv.ok) {
                        if (idx < CFG.rows.length) CFG.rows[idx].icon = sv.id;
                        if (!CFG.cover) CFG.cover = sv.id;
                      } else throw sv.error;
                    });
                });
              });
              return chain;
            })
            .then(function () {
              saveCfg();
              renderRows();
              bSt("✅ Фото привязаны к строкам по порядку. Жми 🔄 Обновить.");
            })
            .catch(function (e) {
              bSt("⚠️ " + JSON.stringify(e));
            });
        }

        document.getElementById("bHello").checked = !!CFG.hello;
        document.getElementById("bHello").onchange = function (e) {
          CFG.hello = e.target.checked;
          saveCfg();
        };
        renderTpls();
        renderRows();
        document
          .getElementById("bRows")
          .addEventListener("input", function (e) {
            var i = e.target.dataset.i,
              f = e.target.dataset.f;
            if (i !== undefined) {
              CFG.rows[i][f] = e.target.value;
              saveCfg();
            }
          });
        document
          .getElementById("bRows")
          .addEventListener("click", function (e) {
            if (e.target.dataset.del !== undefined) {
              CFG.rows.splice(Number(e.target.dataset.del), 1);
              saveCfg();
              renderRows();
            }
          });
        document.getElementById("bAdd").onclick = function () {
          CFG.rows.push({
            t: "Услуга · цена",
            d: "Описание",
            b: "Выбрать",
            u: APP_URL,
            icon: "",
          });
          saveCfg();
          renderRows();
        };
        document.getElementById("bPhotos").onclick = function () {
          document.getElementById("bFile").click();
        };
        document.getElementById("bFile").onchange = uploadPhotos;
        document.getElementById("bUpdate").onclick = update;
      })();
    </script>
  </body>
</html>
